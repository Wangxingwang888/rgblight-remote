<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>RGB Light 远程控制</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:#0f0f1a;color:#fff;min-height:100vh;max-width:480px;margin:0 auto;padding:0 0 40px}
h1{font-size:19px;padding:16px 20px 4px}
.sub{font-size:11px;color:#666;padding:0 20px 12px;font-family:monospace}
.card{background:#1a1a2e;border-radius:16px;padding:16px;margin:12px 14px}
.row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.row:last-child{margin-bottom:0}
.lbl{font-size:13px;color:#aaa}
.val{font-size:12px;color:#4a9eff;font-family:monospace;min-width:34px;text-align:right}
input[type=text]{width:100%;padding:12px;border:none;border-radius:10px;background:#252538;color:#fff;font-size:15px;outline:none;font-family:monospace;letter-spacing:1px}
input[type=text]::placeholder{color:#555}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:6px;border-radius:3px;background:#252538;outline:none;margin:0 12px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:20px;height:20px;border-radius:50%;background:#4a9eff;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.4)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border:none;border-radius:50%;background:#4a9eff;cursor:pointer}
.btn{padding:12px 18px;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;color:#fff;background:#4a9eff;transition:.2s}
.btn:active{transform:scale(.96)}
.btn.ghost{background:#252538}
.btn:disabled{opacity:.4}
/* power switch */
.sw{width:56px;height:30px;border-radius:15px;background:#333;position:relative;cursor:pointer;transition:.3s;flex-shrink:0}
.sw.on{background:#4a9eff}
.swthumb{width:26px;height:26px;border-radius:50%;background:#fff;position:absolute;top:2px;left:2px;transition:.3s;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.sw.on .swthumb{left:28px}
/* status dots */
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#555;margin-right:6px;vertical-align:middle}
.dot.g{background:#2ecc71;box-shadow:0 0 6px #2ecc71}
.dot.r{background:#e74c3c}
.dot.y{background:#f1c40f}
.stat{font-size:12px;color:#888}
/* wheel */
.wheelwrap{position:relative;width:min(78vw,300px);height:min(78vw,300px);margin:8px auto}
#wheel{width:100%;height:100%;border-radius:50%;box-shadow:0 0 30px rgba(0,0,0,.5);touch-action:none;cursor:crosshair}
.wheelc{position:absolute;top:17%;left:17%;width:66%;height:66%;border-radius:50%;background:#0f0f1a;pointer-events:none;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 20px rgba(0,0,0,.5)}
.curcol{width:44px;height:44px;border-radius:50%;background:#000;box-shadow:0 0 14px rgba(0,0,0,.6);transition:background .15s}
.pickdot{position:absolute;width:20px;height:20px;border-radius:50%;border:3px solid #fff;background:transparent;box-shadow:0 0 8px rgba(0,0,0,.5);pointer-events:none;transform:translate(-50%,-50%);display:none;z-index:5}
/* quick colors */
.quick{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding-top:6px}
.qball{width:36px;height:36px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:.15s;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.qball:active{transform:scale(.9)}
/* effects */
.effgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.eff{padding:11px 4px;border:none;border-radius:10px;background:#252538;color:#ccc;font-size:13px;cursor:pointer;transition:.15s}
.eff.on{background:#4a9eff;color:#fff;font-weight:600}
.eff:active{transform:scale(.95)}
.sect{font-size:13px;color:#888;margin:14px 0 8px;letter-spacing:1px}
.hidden{display:none}
.foot{text-align:center;font-size:11px;color:#444;padding:14px}
</style>
</head>
<body>
<h1>RGB Light 远程控制</h1>
<div class="sub" id="devsub">via MQTT · broker.emqx.io</div>

<div class="card">
  <div class="row">
    <span class="lbl">设备 ID</span>
    <span class="stat"><span class="dot" id="brokerdot"></span><span id="brokertxt">未连接</span></span>
  </div>
  <div class="row">
    <input type="text" id="devid" placeholder="RGBL_XXXXXX" maxlength="16">
  </div>
  <div class="row" style="margin-top:12px">
    <span class="stat" id="devtxt">设备状态未知</span>
    <button class="btn" id="connbtn">连接</button>
  </div>
</div>

<div id="panel" class="hidden">
<div class="card">
  <div class="row">
    <span class="lbl" style="font-size:15px;color:#ddd">电源</span>
    <div class="sw" id="pwrsw"><div class="swthumb"></div></div>
  </div>
</div>

<div class="card">
  <div class="sect">颜色</div>
  <div class="wheelwrap">
    <canvas id="wheel" width="300" height="300"></canvas>
    <div class="wheelc"><div class="curcol" id="curcol"></div></div>
    <div class="pickdot" id="pickdot"></div>
  </div>
  <div class="quick" id="quick"></div>
  <div class="sect">RGB 亮度</div>
  <div class="row"><span class="lbl">彩光</span><input type="range" id="rgbbri" min="0" max="100" value="100"><span class="val" id="rgbbriv">100</span></div>
</div>

<div class="card">
  <div class="sect">白光（色温）</div>
  <div class="row"><span class="lbl">冷白 CW</span><input type="range" id="cw" min="0" max="255" value="0"><span class="val" id="cwv">0</span></div>
  <div class="row"><span class="lbl">暖白 WW</span><input type="range" id="ww" min="0" max="255" value="0"><span class="val" id="wwv">0</span></div>
  <div class="sect">白光亮度</div>
  <div class="row"><span class="lbl">白光</span><input type="range" id="cwbri" min="0" max="100" value="100"><span class="val" id="cwbriv">100</span></div>
</div>

<div class="card">
  <div class="sect">特效</div>
  <div class="effgrid" id="effgrid"></div>
  <div class="sect">速度</div>
  <div class="row"><span class="lbl">速度</span><input type="range" id="speed" min="1" max="100" value="50"><span class="val" id="speedv">50</span></div>
</div>
</div>

<div class="foot">RGB Light Remote · MQTT over WSS · v5.0</div>

<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
"use strict";
const $=id=>document.getElementById(id);
const EFFECTS=[["breath","呼吸"],["jump","跳变"],["gradient","渐变"],["strobe","爆闪"],["candle","烛光"],["rainbow_chase","彩虹"],["random","随机"],["sunset","日落"],["aurora","极光"]];
const QUICK=[["#ff0000",255,0,0],["#ff8000",255,128,0],["#ffff00",255,255,0],["#00ff00",0,255,0],["#00ffff",0,255,255],["#0000ff",0,0,255],["#8000ff",128,0,255],["#ff00ff",255,0,255],["#ffffff",255,255,255]];
let client=null,devId="",connected=false;
let S={power:false,r:255,g:0,b:0,cw:0,ww:0,rgb_brightness:100,cw_brightness:100};
let curEffect="";
/* ---------- helpers ---------- */
function hsv2rgb(h,s,v){h=((h%360)+360)%360;const c=v*s,x=c*(1-Math.abs((h/60)%2-1)),m=v-c;let r,g,b;
 if(h<60){r=c;g=x;b=0}else if(h<120){r=x;g=c;b=0}else if(h<180){r=0;g=c;b=x}
 else if(h<240){r=0;g=x;b=c}else if(h<300){r=x;g=0;b=c}else{r=c;g=0;b=x}
 return [Math.round((r+m)*255),Math.round((g+m)*255),Math.round((b+m)*255)]}
function rgb2hsv(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let h=0;
 if(d){if(mx===r)h=60*(((g-b)/d)%6);else if(mx===g)h=60*((b-r)/d+2);else h=60*((r-g)/d+4)}
 if(h<0)h+=360;return [h,mx?d/mx:0,mx]}
function debounce(fn,ms){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}}
/* ---------- MQTT ---------- */
function setBroker(st,txt){const d=$("brokerdot");d.className="dot "+st;$("brokertxt").textContent=txt}
function connect(){
  devId=$("devid").value.trim();
  if(!devId){$("devid").focus();return}
  localStorage.setItem("rgblight_devid",devId);
  if(client){try{client.end(true)}catch(e){}client=null}
  setBroker("y","连接中…");
  $("connbtn").disabled=true;
  const cid="rgblight-web-"+Math.random().toString(16).slice(2,10);
  client=mqtt.connect("wss://broker.emqx.io:8084/mqtt",{clientId:cid,keepalive:30,connectTimeout:8000,reconnectPeriod:4000,clean:true});
  client.on("connect",()=>{
    connected=true;setBroker("g","已连接");$("connbtn").disabled=false;$("connbtn").textContent="重新连接";
    client.subscribe("rgblight/"+devId+"/state",{qos:0});
    $("panel").classList.remove("hidden");
    $("devsub").textContent=devId+" · via MQTT · broker.emqx.io";
    $("devtxt").textContent="已订阅设备状态主题";
  });
  client.on("message",(t,payload)=>{
    if(t!=="rgblight/"+devId+"/state")return;
    try{const st=JSON.parse(payload.toString());applyState(st)}catch(e){}
  });
  client.on("close",()=>{connected=false;setBroker("r","已断开")});
  client.on("error",e=>{setBroker("r","连接错误");$("connbtn").disabled=false});
  client.on("reconnect",()=>setBroker("y","重连中…"));
}
function pub(obj){
  if(!client||!connected)return;
  client.publish("rgblight/"+devId+"/ctrl",JSON.stringify(obj),{qos:0});
}
/* ---------- state sync ---------- */
function applyState(st){
  Object.assign(S,st);
  $("pwrsw").classList.toggle("on",!!S.power);
  if(!dragging){
    $("curcol").style.background="rgb("+S.r+","+S.g+","+S.b+")";
    $("cw").value=S.cw;$("cwv").textContent=S.cw;
    $("ww").value=S.ww;$("wwv").textContent=S.ww;
    placePick();
  }
  $("rgbbri").value=S.rgb_brightness;$("rgbbriv").textContent=S.rgb_brightness;
  $("cwbri").value=S.cw_brightness;$("cwbriv").textContent=S.cw_brightness;
  $("devtxt").textContent="设备在线 · "+new Date().toLocaleTimeString();
}
/* ---------- wheel ---------- */
const wheel=$("wheel"),ctx=wheel.getContext("2d"),W=300,R=W/2;
(function drawWheel(){
  const img=ctx.createImageData(W,W);
  for(let y=0;y<W;y++)for(let x=0;x<W;x++){
    const dx=x-R,dy=y-R,d=Math.sqrt(dx*dx+dy*dy),i=(y*W+x)*4;
    if(d>R){img.data[i+3]=0;continue}
    const ang=Math.atan2(dy,dx)*180/Math.PI,sat=d/R;
    const[r,g,b]=hsv2rgb(ang,sat,1);
    img.data[i]=r;img.data[i+1]=g;img.data[i+2]=b;img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
})();
let dragging=false;
function pickAt(ev){
  const rect=wheel.getBoundingClientRect();
  const px=(ev.clientX-rect.left)*(W/rect.width),py=(ev.clientY-rect.top)*(W/rect.height);
  const dx=px-R,dy=py-R;let d=Math.sqrt(dx*dx+dy*dy);if(d>R)return;
  const ang=(Math.atan2(dy,dx)*180/Math.PI+360)%360,sat=Math.min(1,d/R);
  const[r,g,b]=hsv2rgb(ang,sat,1);
  S.r=r;S.g=g;S.b=b;S.cw=0;S.ww=0;
  $("curcol").style.background="rgb("+r+","+g+","+b+")";
  $("cw").value=0;$("cwv").textContent=0;$("ww").value=0;$("wwv").textContent=0;
  const pd=$("pickdot");pd.style.display="block";
  pd.style.left=(ev.clientX-rect.left)+"px";pd.style.top=(ev.clientY-rect.top)+"px";
  pubColor();
}
const pubColor=debounce(()=>{
  stopEffectUI();
  pub({action:"color",r:S.r,g:S.g,b:S.b,cw:S.cw,ww:S.ww});
},150);
function placePick(){
  if(S.r===0&&S.g===0&&S.b===0){$("pickdot").style.display="none";return}
  const[h,s]=rgb2hsv(S.r,S.g,S.b),rad=h*Math.PI/180,d=s*R;
  const rect=wheel.getBoundingClientRect(),sc=rect.width/W;
  const pd=$("pickdot");pd.style.display="block";
  pd.style.left=(R+Math.cos(rad)*d)*sc+"px";pd.style.top=(R+Math.sin(rad)*d)*sc+"px";
}
wheel.addEventListener("pointerdown",e=>{dragging=true;wheel.setPointerCapture(e.pointerId);pickAt(e)});
wheel.addEventListener("pointermove",e=>{if(dragging)pickAt(e)});
wheel.addEventListener("pointerup",()=>dragging=false);
/* ---------- quick colors ---------- */
QUICK.forEach(([hex,r,g,b])=>{
  const d=document.createElement("div");d.className="qball";d.style.background=hex;
  d.onclick=()=>{S.r=r;S.g=g;S.b=b;S.cw=0;S.ww=0;
    $("curcol").style.background=hex;$("cw").value=0;$("cwv").textContent=0;$("ww").value=0;$("wwv").textContent=0;
    placePick();stopEffectUI();pub({action:"color",r,g,b,cw:0,ww:0})};
  $("quick").appendChild(d);
});
/* ---------- sliders ---------- */
$("pwrsw").onclick=()=>{S.power=!S.power;$("pwrsw").classList.toggle("on",S.power);pub({action:"power",value:S.power})};
$("rgbbri").oninput=e=>{$("rgbbriv").textContent=e.target.value};
$("rgbbri").onchange=debounce(e=>pub({action:"rgb_brightness",value:+e.target.value}),150);
$("cwbri").oninput=e=>{$("cwbriv").textContent=e.target.value};
$("cwbri").onchange=debounce(e=>pub({action:"cw_brightness",value:+e.target.value}),150);
const pubWhite=debounce(()=>{
  stopEffectUI();
  pub({action:"color",r:S.r,g:S.g,b:S.b,cw:S.cw,ww:S.ww});
},150);
$("cw").oninput=e=>{S.cw=+e.target.value;$("cwv").textContent=S.cw;pubWhite()};
$("ww").oninput=e=>{S.ww=+e.target.value;$("wwv").textContent=S.ww;pubWhite()};
/* ---------- effects ---------- */
EFFECTS.forEach(([name,label])=>{
  const b=document.createElement("button");b.className="eff";b.textContent=label;b.dataset.e=name;
  b.onclick=()=>{
    if(curEffect===name){stopEffectUI();pub({action:"effect",effect:""});return}
    setEffectUI(name);
    pub({action:"effect",effect:name,speed:+$("speed").value});
  };
  $("effgrid").appendChild(b);
});
function setEffectUI(name){curEffect=name;document.querySelectorAll(".eff").forEach(b=>b.classList.toggle("on",b.dataset.e===name))}
function stopEffectUI(){setEffectUI("")}
$("speed").oninput=e=>{$("speedv").textContent=e.target.value};
$("speed").onchange=debounce(e=>{if(curEffect)pub({action:"effect",effect:curEffect,speed:+e.target.value})},200);
/* ---------- init ---------- */
$("connbtn").onclick=connect;
$("devid").value=localStorage.getItem("rgblight_devid")||"";
$("devid").addEventListener("keydown",e=>{if(e.key==="Enter")connect()});
</script>
</body>
</html>
