<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>RGB Light 远程控制</title>
<meta name="theme-color" content="#0f0f1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RGB Light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:#0f0f1a;color:#fff;min-height:100vh;max-width:480px;margin:0 auto;padding:0 0 40px}
h1{font-size:16px;padding:10px 16px 0}
.sub{font-size:10px;color:#666;padding:0 16px 6px;font-family:monospace}
.toprow{display:flex;align-items:center;justify-content:flex-end;gap:12px;padding:4px 16px}
.pwrlabel{font-size:13px;color:#aaa}
.sw{width:50px;height:27px;border-radius:14px;background:#333;position:relative;cursor:pointer;transition:.3s;flex-shrink:0}
.sw.on{background:#4a9eff}
.swthumb{width:23px;height:23px;border-radius:50%;background:#fff;position:absolute;top:2px;left:2px;transition:.3s;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.sw.on .swthumb{left:25px}
.card{background:#1a1a2e;border-radius:14px;padding:12px;margin:8px 14px}
.row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.row:last-child{margin-bottom:0}
.lbl{font-size:12px;color:#aaa}
.stat{font-size:11px;color:#888}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#555;margin-right:5px;vertical-align:middle}
.dot.g{background:#2ecc71;box-shadow:0 0 6px #2ecc71}
.dot.r{background:#e74c3c}
.dot.y{background:#f1c40f}
select{width:100%;padding:10px;border:none;border-radius:10px;background:#252538;color:#fff;font-size:14px;outline:none;font-family:monospace}
input[type=text]{width:100%;padding:10px;border:none;border-radius:10px;background:#252538;color:#fff;font-size:14px;outline:none;font-family:monospace;letter-spacing:1px}
input::placeholder{color:#555}
.btn{padding:10px 16px;border:none;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;color:#fff;background:#4a9eff;transition:.2s}
.btn:active{transform:scale(.96)}
.btn.ghost{background:#252538}
.btn:disabled{opacity:.4}
.wheelwrap{position:relative;width:min(74vw,330px);height:min(74vw,330px);margin:6px auto 0}
#wheel{width:100%;height:100%;border-radius:50%;display:block;touch-action:none;cursor:crosshair;box-shadow:0 0 24px rgba(0,0,0,.5)}
.pickdot{position:absolute;width:18px;height:18px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 6px rgba(0,0,0,.6);pointer-events:none;transform:translate(-50%,-50%);z-index:5}
.colortxt{text-align:center;padding:6px 16px 2px}
.cname{font-size:14px;color:#ccc;font-weight:600}
.rgbval{font-size:11px;color:#666;font-family:monospace;margin-top:1px}
.quick{display:flex;justify-content:center;gap:9px;padding:5px 16px 3px}
.qball{width:30px;height:30px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:.15s;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.qball.active{border-color:#fff;transform:scale(1.08)}
.qball.r{background:#f33}.qball.g{background:#3f3}.qball.b{background:#33f}.qball.y{background:#fd3}.qball.p{background:#f3d}.qball.c{background:#3df}
.slidsec{padding:9px 16px 5px}
.slidlabel{display:flex;justify-content:space-between;font-size:12px;color:#888;margin-bottom:4px}
.slidlabel .v{color:#fa5;font-weight:600}
.slidbar{width:100%;height:52px;border-radius:12px;position:relative;cursor:pointer;overflow:hidden;box-shadow:inset 0 2px 6px rgba(0,0,0,.4)}
.slidthumb{width:34px;height:34px;border-radius:50%;background:#fff;border:3px solid rgba(255,255,255,.95);position:absolute;top:9px;box-shadow:0 2px 8px rgba(0,0,0,.5);pointer-events:none;transform:translateX(-50%);transition:left .08s}
.rgbbar{background:linear-gradient(90deg,#000 0%,#222 9%,#f00 19%,#f80 34%,#ff0 49%,#0f0 64%,#0ff 79%,#00f 90%,#f0f 100%)}
.cwbar{background:linear-gradient(90deg,#000 0%,#444 25%,#888 50%,#ccc 75%,#fff 100%)}
.tempbar{background:linear-gradient(90deg,#f80 0%,#fc6 25%,#fff 50%,#8bf 75%,#46a 100%)}
.conn{display:flex;align-items:center;justify-content:space-between;margin:5px 16px;padding:5px 12px;background:#1a1a2e;border-radius:10px}
.conndot{width:7px;height:7px;border-radius:50%;background:#00d26a;box-shadow:0 0 6px #00d26a}
.connoff{background:#f47;box-shadow:0 0 6px #f47}
.conntext{font-size:11px;color:#00d26a}
.connip{font-size:11px;color:#888;font-family:monospace}
.hidden{display:none}
.instbar{position:fixed;bottom:0;left:0;right:0;background:#1a1a2e;border-top:1px solid #252538;padding:10px 16px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;z-index:100;max-width:480px;margin:0 auto}
.insttxt{font-size:12px;color:#ccc;line-height:1.5}
.instbtn{padding:9px 16px;border:none;border-radius:10px;background:#4a9eff;color:#fff;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
body.poweroff .wheelwrap,body.poweroff .quick,body.poweroff .slidsec{opacity:.35;pointer-events:none}
</style>
</head>
<body id="appBody">
<h1>RGB Light 远程控制</h1>
<div class="sub" id="devsub">MQTT · 全球可控制 · 请添加到主屏幕</div>

<div class="card">
  <div class="row">
    <span class="lbl">选择设备</span>
    <span class="stat"><span class="dot" id="brokerdot"></span><span id="brokertxt">未连接</span></span>
  </div>
  <div class="row" style="margin-bottom:6px">
    <select id="devsel"><option value="">— 输入或选择设备 ID —</option></select>
  </div>
  <div class="row">
    <input type="text" id="devid" placeholder="RGBL_XXXXXX" maxlength="16" style="flex:1;margin-right:10px">
    <button class="btn" id="connbtn">连接</button>
  </div>
  <div class="row" style="margin-top:6px">
    <span class="stat" id="devtxt">未连接设备</span>
  </div>
</div>

<div id="panel" class="hidden">
<div class="toprow">
  <div class="pwrlabel" id="pwrlabel">POWER</div>
  <div class="sw" id="pwrSw"><div class="swthumb"></div></div>
</div>
<div class="wheelwrap">
  <canvas id="wheel" width="320" height="320"></canvas>
  <div class="pickdot" id="pdot" style="display:none"></div>
</div>
<div class="colortxt"><div class="cname" id="cname">WHITE</div><div class="rgbval" id="rgbTxt">R:0 G:0 B:0</div></div>
<div class="quick">
  <div class="qball r" onclick="sq(255,0,0,this)"></div>
  <div class="qball g" onclick="sq(0,255,0,this)"></div>
  <div class="qball b" onclick="sq(0,0,255,this)"></div>
  <div class="qball y" onclick="sq(255,255,0,this)"></div>
  <div class="qball p" onclick="sq(255,0,255,this)"></div>
  <div class="qball c" onclick="sq(0,255,255,this)"></div>
</div>
<div class="slidsec">
  <div class="slidlabel"><span>RGB BRIGHT</span><span class="v" id="rbv">100%</span></div>
  <div class="slidbar rgbbar" id="rbbar"><div class="slidthumb" id="rbthumb" style="left:100%"></div></div>
</div>
<div class="slidsec">
  <div class="slidlabel"><span>TEMP</span><span class="v" id="tv">Neutral</span></div>
  <div class="slidbar tempbar" id="tbar"><div class="slidthumb" id="tthumb" style="left:50%"></div></div>
</div>
<div class="slidsec">
  <div class="slidlabel"><span>CW BRIGHT</span><span class="v" id="cbv">100%</span></div>
  <div class="slidbar cwbar" id="cbbar"><div class="slidthumb" id="cbthumb" style="left:100%"></div></div>
</div>
<div class="conn">
  <div style="display:flex;align-items:center;gap:6px"><div class="conndot" id="cdot"></div><div class="conntext" id="ctxt">离线</div></div>
  <div class="connip" id="cip">--</div>
</div>
</div>

<div class="instbar" id="instbar">
  <div class="insttxt" id="insttxt">添加到主屏幕，像 App 一样使用</div>
  <button class="instbtn" id="instbtn">安装</button>
</div>

<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
"use strict";
const $=id=>document.getElementById(id);
const QUICK=[[255,0,0],[0,255,0],[0,0,255],[255,255,0],[255,0,255],[0,255,255]];
let client=null,devId="",connected=false,online=false;
let S={power:false,r:255,g:255,b:255,cw:0,ww:0,rgb_brightness:100,cw_brightness:100};
const savedDevs={};

/* ---------- PWA install ---------- */
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();deferredPrompt=e;
  $('instbar').classList.remove('hidden');
  $('insttxt').textContent='安装到主屏幕，像 App 一样控制';
});
$('instbtn').onclick=async()=>{
  if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;$('instbar').classList.add('hidden')}
  else if(isIOS()){
    $('insttxt').innerHTML='iOS 请点浏览器底部<b>分享</b>按钮 → <b>添加到主屏幕</b>';
  }
};
function isIOS(){return /iphone|ipad|ipod/i.test(navigator.userAgent)}
function inStandalone(){return window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}
if(!inStandalone()){
  if(isIOS()&&!deferredPrompt){$('instbar').classList.remove('hidden');$('insttxt').textContent='iOS: 点分享按钮 → 添加到主屏幕'}
}else{$('instbar').classList.add('hidden')}

/* ---------- MQTT ---------- */
function setBroker(st,txt){const d=$('brokerdot');d.className='dot '+st;$('brokertxt').textContent=txt}
function devTopic(sfx){return 'rgblight/'+devId+'/'+sfx}
function connect(){
  const id=$('devid').value.trim().toUpperCase();
  if(!id){$('devid').focus();return}
  devId=id;
  localStorage.setItem('rgblight_devid',devId);
  if(client){try{client.end(true)}catch(e){}client=null}
  setBroker('y','连接中…');$('connbtn').disabled=true;
  client=mqtt.connect('wss://broker.emqx.io:8084/mqtt',{clientId:'rgblight-web-'+Math.random().toString(16).slice(2,10),keepalive:30,connectTimeout:8000,reconnectPeriod:4000,clean:true});
  client.on('connect',()=>{
    connected=true;setBroker('g','已连接');$('connbtn').disabled=false;$('connbtn').textContent='重新连接';
    client.subscribe('rgblight/devices/#',{qos:0});
    client.subscribe(devTopic('state'),{qos:0});
    $('panel').classList.remove('hidden');
    $('devsub').textContent=devId+' · MQTT · 全球可控制';
    $('devtxt').textContent='已订阅设备状态';
  });
  client.on('message',(t,p)=>{
    const topic=t.toString();
    if(topic==='rgblight/devices/'+devId){
      try{const d=JSON.parse(p.toString());if(d.ip)$('cip').textContent=d.ip}catch(e){}
    }
    else if(topic.startsWith('rgblight/devices/')&&topic!==devTopic('state')){
      const did=topic.split('/').pop();
      if(did&&did!==devId&&!savedDevs[did]){
        savedDevs[did]=true;
        const opt=document.createElement('option');opt.value=did;opt.textContent=did;
        $('devsel').appendChild(opt);
      }
    }
    else if(topic===devTopic('state')){
      try{applyState(JSON.parse(p.toString()))}catch(e){}
    }
  });
  client.on('close',()=>{connected=false;online=false;setBroker('r','已断开');$('devtxt').textContent='连接断开'});
  client.on('error',()=>{setBroker('r','连接错误');$('connbtn').disabled=false});
  client.on('reconnect',()=>setBroker('y','重连中…'));
}
function pub(obj){if(!client||!connected)return;client.publish(devTopic('ctrl'),JSON.stringify(obj),{qos:0})}
function setDev(id){$('devid').value=id;connect()}
$('devsel').onchange=e=>{if(e.target.value)setDev(e.target.value)};

/* ---------- state sync ---------- */
function applyState(st){
  Object.assign(S,st);
  online=true;
  $('pwrSw').classList.toggle('on',!!S.power);
  $('pwrlabel').textContent=S.power?'POWER':'OFF';
  document.body.classList.toggle('poweroff',!S.power);
  if(!dragging){
    $('cname').textContent=cn(S.r,S.g,S.b);
    $('rgbTxt').textContent='R:'+S.r+' G:'+S.g+' B:'+S.b;
    up();
  }
  $('rbv').textContent=S.rgb_brightness+'%';
  $('cbv').textContent=S.cw_brightness+'%';
  us('rb',S.rgb_brightness/100);us('cb',S.cw_brightness/100);
  if(S.cw+S.ww>0){ut(S.cw/(S.cw+S.ww))}else{ut(0.5)}
  $('ctxt').textContent=online?'在线':'离线';
  $('devtxt').textContent='设备在线 · '+new Date().toLocaleTimeString();
}

/* ---------- wheel (solid pie) ---------- */
const wheel=$('wheel'),ctx=wheel.getContext('2d'),W=320,R=160;
(function lsw(){
  const img=ctx.createImageData(W,W);
  for(let y=0;y<W;y++)for(let x=0;x<W;x++){
    const dx=x-R,dy=y-R,d=Math.sqrt(dx*dx+dy*dy),i=(y*W+x)*4;
    if(d>R){img.data[i+3]=0;continue}
    const ang=((Math.atan2(dy,dx)*180/Math.PI)+360)%360,sat=d/R;
    const c=hsv(ang/360,sat,1);
    img.data[i]=c.r;img.data[i+1]=c.g;img.data[i+2]=c.b;img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
})();
let dragging=false;
function pc(e){
  const rect=wheel.getBoundingClientRect(),sc=W/rect.width;
  const px=(e.clientX-rect.left)*sc,py=(e.clientY-rect.top)*sc;
  const dx=px-R,dy=py-R,d=Math.sqrt(dx*dx+dy*dy);
  if(d>R-2)return;
  const ang=((Math.atan2(dy,dx)*180/Math.PI)+360)%360,sat=d/R;
  if(sat<0.06){S.r=255;S.g=255;S.b=255}else{const c=hsv(ang/360,sat,1);S.r=c.r;S.g=c.g;S.b=c.b}
  S.cw=0;S.ww=0;
  document.querySelectorAll('.qball').forEach(b=>b.classList.remove('active'));
  up();ui();pub({action:'color',r:S.r,g:S.g,b:S.b,cw:0,ww:0});
}
function up(){
  const pd=$('pdot');
  if(S.r===255&&S.g===255&&S.b===255){pd.style.left='50%';pd.style.top='50%'}
  else{
    const r=S.r/255,g=S.g/255,b=S.b/255,max=Math.max(r,g,b),min=Math.min(r,g,b);
    let h=0;if(max!==min){if(max===r)h=(g-b)/(max-min);else if(max===g)h=2+(b-r)/(max-min);else h=4+(r-g)/(max-min)}
    h=(h*60+360)%360;const s=max===0?0:1-min/max,rad=h*Math.PI/180,dist=s*50;
    pd.style.left=(50+Math.cos(rad)*dist)+'%';pd.style.top=(50+Math.sin(rad)*dist)+'%';
  }
  pd.style.background='rgb('+S.r+','+S.g+','+S.b+')';pd.style.display='block';
}
wheel.addEventListener('pointerdown',e=>{dragging=true;try{wheel.setPointerCapture(e.pointerId)}catch(x){}pc(e)});
wheel.addEventListener('pointermove',e=>{if(dragging)pc(e)});
wheel.addEventListener('pointerup',()=>dragging=false);
wheel.addEventListener('pointercancel',()=>dragging=false);

/* ---------- quick ---------- */
QUICK.forEach((c,i)=>{
  const el=document.querySelectorAll('.qball')[i];
  el.onclick=()=>{if(!S.power)return;S.r=c[0];S.g=c[1];S.b=c[2];S.cw=0;S.ww=0;
    document.querySelectorAll('.qball').forEach(b=>b.classList.remove('active'));el.classList.add('active');
    up();ui();pub({action:'color',r:c[0],g:c[1],b:c[2],cw:0,ww:0})};
});

/* ---------- sliders ---------- */
$('pwrSw').onclick=()=>{S.power=!S.power;$('pwrSw').classList.toggle('on',S.power);$('pwrlabel').textContent=S.power?'POWER':'OFF';document.body.classList.toggle('poweroff',!S.power);pub({action:'power',value:S.power})};
function hs(tp,e){
  const bar=$({rb:'rbbar',t:'tbar',cb:'cbbar'}[tp]);
  const rect=bar.getBoundingClientRect();
  const pct=Math.max(0,Math.min(1,((e.clientX||e.pageX)-rect.left)/rect.width));
  if(tp==='rb'){S.rgb_brightness=Math.round(pct*100);us('rb',pct)}
  else if(tp==='cb'){S.cw_brightness=Math.round(pct*100);us('cb',pct)}
  else if(tp==='t'){S.cw=Math.round(pct*255);S.ww=Math.round((1-pct)*255);ut(pct)}
}
function sb(tp){
  if(tp==='rb')pub({action:'rgb_brightness',value:S.rgb_brightness});
  else if(tp==='cb')pub({action:'cw_brightness',value:S.cw_brightness});
  else if(tp==='t')pub({action:'color',r:S.r,g:S.g,b:S.b,cw:S.cw,ww:S.ww});
}
['rbbar','tbar','cbbar'].forEach(id=>{
  const el=$(id),tp=id.replace('bar','');
  el.addEventListener('click',e=>{hs(tp,e);sb(tp)});
  el.addEventListener('touchstart',e=>{e.preventDefault();hs(tp,e.touches[0])},{passive:false});
  el.addEventListener('touchmove',e=>{e.preventDefault();hs(tp,e.touches[0])},{passive:false});
  el.addEventListener('touchend',()=>sb(tp),{passive:false});
});
function us(tp,pct){const el=$({rb:'rbthumb',cb:'cbthumb'}[tp]);if(el)el.style.left=(pct*100)+'%'}
function ut(pct){const el=$('tthumb');el.style.left=(pct*100)+'%';const v=$('tv');
  if(pct<.33)v.textContent='WARM';else if(pct>.66)v.textContent='COLD';else v.textContent='NEUTRAL';v.style.color=pct<.5?'#fa5':'#8bf'}
function ui(){ui2()}
function ui2(){
  $('cname').textContent=cn(S.r,S.g,S.b);
  $('rgbTxt').textContent='R:'+S.r+' G:'+S.g+' B:'+S.b;
  us('rb',S.rgb_brightness/100);us('cb',S.cw_brightness/100);
  if(S.cw+S.ww>0){ut(S.cw/(S.cw+S.ww))}else{ut(0.5)}
}
function cn(r,g,b){
  if(r>200&&g<80&&b<80)return'RED';if(r<80&&g>200&&b<80)return'GREEN';if(r<80&&g<80&&b>200)return'BLUE';
  if(r>200&&g>200&&b<80)return'YELLOW';if(r>200&&g<80&&b>200)return'PURPLE';if(r<80&&g>200&&b>200)return'CYAN';
  if(r>200&&g>100&&b<80)return'ORANGE';if(r>180&&g>180&&b>180)return'WHITE';if(r<60&&g<60&&b<60)return'BLACK';
  return'COLOR';
}
function hsv(h,s,v){
  let r,g,b;const i=Math.floor(h*6),f=h*6-i,p=v*(1-s),q=v*(1-f*s),t=v*(1-(1-f)*s);
  switch(i%6){case 0:r=v;g=t;b=p;break;case 1:r=q;g=v;b=p;break;case 2:r=p;g=v;b=t;break;
    case 3:r=p;g=q;b=v;break;case 4:r=t;g=p;b=v;break;case 5:r=v;g=p;b=q;break}
  return{r:Math.round(r*255),g:Math.round(g*255),b:Math.round(b*255)};
}

/* ---------- init ---------- */
$('connbtn').onclick=connect;
$('devid').addEventListener('keydown',e=>{if(e.key==='Enter')connect()});
const q=new URLSearchParams(location.search);
const urlDev=(q.get('dev')||'').toUpperCase();
const saved=localStorage.getItem('rgblight_devid')||'';
$('devid').value=urlDev||saved||'';
if(navigator.serviceWorker){navigator.serviceWorker.register('sw.js').catch(()=>{})}
if(urlDev){connect()}else if(saved){connect()}
</script>
</body>
</html>
